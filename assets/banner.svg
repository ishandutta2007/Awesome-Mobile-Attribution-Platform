<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out alternate;
      }
      .pulse-circle-delayed {
        animation: pulse 4s infinite ease-in-out 1.5s alternate;
      }
      .float-particle {
        animation: float 6s infinite ease-in-out alternate;
      }
      .dash-line {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.3; }
        100% { transform: scale(1.15); opacity: 0.7; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -140; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="12" fill="url(#bg-grad)"/>

  <!-- Dynamic / Animated Background Layer -->
  <g opacity="0.35">
    <!-- Glowing background blurred blobs -->
    <circle cx="150" cy="60" r="90" fill="#3b82f6" filter="url(#glow)" class="pulse-circle"/>
    <circle cx="750" cy="180" r="110" fill="#8b5cf6" filter="url(#glow)" class="pulse-circle-delayed"/>
    <circle cx="820" cy="50" r="70" fill="#06b6d4" filter="url(#glow)" class="pulse-circle"/>

    <!-- Dynamic Network Lines -->
    <line x1="100" y1="180" x2="250" y2="120" stroke="#38bdf8" stroke-width="1.5" class="dash-line" />
    <line x1="250" y1="120" x2="450" y2="190" stroke="#818cf8" stroke-width="1.5" class="dash-line" />
    <line x1="450" y1="190" x2="680" y2="110" stroke="#c084fc" stroke-width="1.5" class="dash-line" />
    <line x1="680" y1="110" x2="820" y2="170" stroke="#38bdf8" stroke-width="1.5" class="dash-line" />

    <!-- Animated Data Nodes -->
    <g class="float-particle">
      <circle cx="100" cy="180" r="5" fill="#38bdf8" />
      <circle cx="250" cy="120" r="6" fill="#818cf8" />
      <circle cx="450" cy="190" r="5" fill="#c084fc" />
      <circle cx="680" cy="110" r="7" fill="#38bdf8" />
      <circle cx="820" cy="170" r="4" fill="#a78bfa" />
    </g>
  </g>

  <!-- Card Border Highlight -->
  <rect width="898" height="238" x="1" y="1" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Foreground Content Layer (Text strictly above background animations) -->
  <g transform="translate(450, 120)" text-anchor="middle">
    <!-- Icon / Subtitle Badge -->
    <g transform="translate(0, -55)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">
        📱 MOBILE MEASUREMENT &amp; ATTRIBUTION
      </text>
    </g>

    <!-- Main Title -->
    <text y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">
      Awesome Mobile Attribution Platform
    </text>

    <!-- Subtitle -->
    <text y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="url(#sub-grad)">
      Curated List of SaaS MMPs, Open-Source Pipelines, SKAN Privacy &amp; Deep Linking Ecosystem
    </text>
  </g>
</svg>
